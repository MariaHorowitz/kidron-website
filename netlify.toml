"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Build from the website files in Maria’s own repository. No external template.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old WordPress addresses that may be bookmarked or indexed.
[[redirects]]
  from = "/home-kidron/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/hello-world/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

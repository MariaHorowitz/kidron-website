# Kidron Capital website. This repo holds only the content (site.json + images/).
# The layout comes from the Metanoia site template, fetched at build time from its "stable"
# branch, so a template update reaches this site on the next build without touching this repo.
# If a build fails, Netlify keeps the last working version live.
[build]
  command = "rm -rf .template && git clone --depth 1 --branch stable https://github.com/krystof-metanoia-ops/metanoia-site-template.git .template && node .template/build.mjs --content . --out dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old WordPress addresses that may be bookmarked or indexed.
[[redirects]]
  from = "/home-kidron/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/hello-world/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
